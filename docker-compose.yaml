version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: softlab_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-78357Cas}
      MYSQL_DATABASE: softlab_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Ejecuta el schema.sql automáticamente al iniciar el contenedor por primera vez
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-78357Cas}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: softlab_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-78357Cas}@db:3306/softlab_db
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_TENANT_ID: ${VITE_TENANT_ID:-1}
    container_name: softlab_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data: