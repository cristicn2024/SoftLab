server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Always revalidate the SPA shell after a deployment so clients don't keep
  # loading an old index.html that points at previous hashed assets.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  # Vite's content-hashed assets are immutable and safe to cache long term.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
